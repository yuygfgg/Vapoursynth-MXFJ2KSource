[build-system]
requires = [
  "cmake>=3.20",
  "hatchling>=1.26",
  "ninja>=1.11",
  "packaging>=24",
  "VapourSynth>=74",
]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-mxfj2ksource"
version = "1.3.0"
description = "VapourSynth source plugin for JPEG 2000 picture essence in MXF files"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["VapourSynth>=74"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/yuygfgg/Vapoursynth-MXFJ2KSource"
Repository = "https://github.com/yuygfgg/Vapoursynth-MXFJ2KSource"

[tool.hatch.build.targets.sdist]
include = [
  "/CMakeLists.txt",
  "/LICENSE",
  "/README.md",
  "/hatch_build.py",
  "/lib",
  "/packaging",
  "/pyproject.toml",
  "/third_party/libMXF",
  "/third_party/libMXFpp",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
