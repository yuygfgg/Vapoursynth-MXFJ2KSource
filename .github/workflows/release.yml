name: release

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GROK_REF: v20.3.3
  CIBW_PROJECT_REQUIRES_PYTHON: ">=3.12"
  CIBW_BUILD_VERBOSITY: "1"
  CIBW_TEST_COMMAND: >-
    vapoursynth config &&
    python -c "import vapoursynth as vs; assert hasattr(vs.core, 'MXFJ2KSource')"

jobs:
  build-wheels:
    name: wheels-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            cibw_build: cp312-win_amd64
            cibw_archs: AMD64
            cibw_environment: >-
              GROK_REF=v20.3.3
              CC=gcc
              CXX=g++
          - name: linux-x64
            runner: ubuntu-24.04
            cibw_build: cp312-manylinux_x86_64
            cibw_archs: x86_64
            cibw_environment: GROK_REF=v20.3.3
          - name: linux-x64-musl
            runner: ubuntu-24.04
            cibw_build: cp312-musllinux_x86_64
            cibw_archs: x86_64
            cibw_environment: >-
              GROK_REF=v20.3.3
              MXFJ2K_GROK_EXTERNAL_FMT=1
          - name: macos-x64
            runner: macos-26-intel
            cibw_build: cp312-macosx_x86_64
            cibw_archs: x86_64
            cibw_environment: >-
              GROK_REF=v20.3.3
              MACOSX_DEPLOYMENT_TARGET=14.0
              CMAKE_OSX_ARCHITECTURES=x86_64
          - name: macos-arm64
            runner: macos-26
            cibw_build: cp312-macosx_arm64
            cibw_archs: arm64
            cibw_environment: >-
              GROK_REF=v20.3.3
              MACOSX_DEPLOYMENT_TARGET=14.0
              CMAKE_OSX_ARCHITECTURES=arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: Add MSYS2 to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT: ${{ matrix.cibw_environment }}
          CIBW_BEFORE_ALL_LINUX: >-
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache git fmt-dev util-linux-dev;
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y git libuuid-devel;
            elif command -v yum >/dev/null 2>&1; then
              yum install -y git libuuid-devel;
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install -U build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: publish-pypi
    needs:
      - build-wheels
      - build-sdist
    if: ${{ startsWith(github.ref, 'refs/tags/R') }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
